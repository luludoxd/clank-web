<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLANk — YouTube Bot Detector</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">CLANk</div>
      <div>
        <h1>YouTube Bot Detector</h1>
        <p>Clanker Logging & Analysis Network</p>
      </div>
    </header>

    <section class="panel">
      <h2>Analyze a video</h2>
      <p class="muted">
        Enter your YouTube API key and the video URL. The key is sent to the server
        only for this analysis request and is not saved by this application.
      </p>

      <label for="apiKey">YouTube API key</label>
      <input id="apiKey" type="password" autocomplete="off"
             placeholder="Paste your API key here">

      <label for="videoUrl">YouTube video URL</label>
      <input id="videoUrl" type="url"
             placeholder="https://www.youtube.com/watch?v=...">

      <button id="analyzeBtn">Analyze video</button>
      <div id="status" class="status"></div>
    </section>

    <section id="summary" class="stats hidden">
      <div><strong id="comments">0</strong><span>Comments</span></div>
      <div><strong id="accounts">0</strong><span>Accounts</span></div>
      <div><strong id="hits">0</strong><span>Flagged results</span></div>
    </section>

    <section id="resultsPanel" class="panel hidden">
      <div class="results-head">
        <h2>Results</h2>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
      <div id="results"></div>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
